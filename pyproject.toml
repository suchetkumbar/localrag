[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localrag-eval"
version = "0.1.0"
description = "RAG evaluation and regression harness over the FastAPI documentation"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
rag-eval = "rag.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["rag*"]

[tool.setuptools.package-data]
"rag.prompts" = ["*.txt"]
"rag.golden" = ["prompts/*.txt"]
"rag.eval" = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs a model download; also gated by RAG_RUN_MODEL_TESTS=1",
]
addopts = [
    "--cov=rag",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]

[tool.coverage.run]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, SIM simplify
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["rag", "tests"]

[[tool.mypy.overrides]]
module = ["fastembed", "fastembed.*"]  # ships without type information
ignore_missing_imports = true
