# Nightly / manual full evaluation over the whole verified golden set.
#
# Like the PR gate, this replays recorded model calls (cache/full.sqlite in the private
# eval-data repo), so it checks that the full results are reproducible from code + data
# on a clean machine. New model calls are recorded locally (`make record-full`), because
# free CI runners cannot run an 8B LLM at a usable speed.
name: Eval full

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      matrix:
        description: "Run all 12 matrix configurations instead of the baseline only"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_DATA: ${{ secrets.EVAL_DATA_TOKEN != '' && vars.EVAL_DATA_REPO != '' }}
    steps:
      - name: Skip when eval data is not available
        if: env.HAS_DATA != 'true'
        run: echo "::notice::EVAL_DATA_REPO / EVAL_DATA_TOKEN not set. Skipped."

      - uses: actions/checkout@v4
        if: env.HAS_DATA == 'true'

      - name: Check out private eval data
        if: env.HAS_DATA == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.EVAL_DATA_REPO }}
          token: ${{ secrets.EVAL_DATA_TOKEN }}
          path: eval-data

      - uses: actions/setup-python@v5
        if: env.HAS_DATA == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        if: env.HAS_DATA == 'true'
        run: |
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Cache raw corpus
        if: env.HAS_DATA == 'true'
        uses: actions/cache@v4
        with:
          path: data/raw
          key: corpus-${{ hashFiles('eval-data/manifests/fastapi.json') }}

      - name: Fetch and prepare corpus
        if: env.HAS_DATA == 'true'
        run: |
          python -m rag.corpus fetch --manifest eval-data/manifests/fastapi.json
          python -m rag.corpus prepare --manifest eval-data/manifests/fastapi.json

      - name: Evaluate
        if: env.HAS_DATA == 'true'
        run: |
          common="--dataset eval-data/golden/v1.jsonl --cache-path eval-data/cache/full.sqlite --cache-mode readonly"
          if [ "${{ inputs.matrix }}" = "true" ]; then
            rag-eval matrix --base configs/baseline.yaml $common
          else
            rag-eval run --config configs/baseline.yaml $common
          fi

      - name: Upload results
        if: always() && env.HAS_DATA == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-full-${{ github.run_id }}
          path: |
            results/**/metrics.json
            results/**/report.md
            results/*.md
          if-no-files-found: ignore
